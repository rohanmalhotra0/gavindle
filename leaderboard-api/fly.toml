# fly.toml app configuration file generated for gavindle-leaderboard-api on 2026-02-24T15:12:50-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gavindle-leaderboard-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LEADERBOARD_PATH = '/data/leaderboard.json'

[[mounts]]
  source = 'leaderboard_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
